<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div class="mx-auto auth-card">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="card">
            <div class="card-header fw-semibold">Đổi mật khẩu</div>
            <div class="card-body">
                <form th:action="@{/account/password}" th:object="${form}" method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu hiện tại</label>
                        <input class="form-control" type="password" th:field="*{currentPassword}" th:errorclass="is-invalid" autocomplete="current-password">
                        <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu mới</label>
                        <input class="form-control" type="password" th:field="*{newPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nhập lại mật khẩu mới</label>
                        <input class="form-control" type="password" th:field="*{confirmPassword}" autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{passwordConfirmed}"></div>
                    </div>
                    <button class="btn btn-primary w-100">Lưu mật khẩu mới</button>
                </form>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
