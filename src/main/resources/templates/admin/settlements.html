<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đối soát shop')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-3">Đối soát với shop</h1>

    <div class="card mb-4">
        <div class="card-header fw-semibold">Shop có đơn chờ đối soát</div>
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light"><tr><th>Shop</th><th>Số đơn</th><th class="text-end">Thu hộ</th><th class="text-end">Phí ship</th><th class="text-end">Tạm tính trả shop</th><th></th></tr></thead>
                <tbody>
                <tr th:each="s : ${summaries}">
                    <td th:text="${s.shop.shopName}"></td>
                    <td th:text="${s.orderCount}"></td>
                    <td class="text-end" th:text="${@fmt.money(s.totalCod)}"></td>
                    <td class="text-end" th:text="${'-' + @fmt.money(s.totalFee)}"></td>
                    <td class="text-end fw-semibold" th:text="${@fmt.money(s.payout())}"></td>
                    <td>
                        <form th:action="@{/admin/settlements}" method="post" onsubmit="return confirm('Lập phiếu đối soát cho shop này?')">
                            <input type="hidden" name="shopId" th:value="${s.shop.id}">
                            <button class="btn btn-sm btn-primary">Lập phiếu</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(summaries)}"><td colspan="6" class="text-center text-muted py-3">Không có shop nào cần đối soát</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <h2 class="h5">Các phiếu đối soát</h2>
    <div class="table-responsive">
        <table class="table bg-white align-middle">
            <thead class="table-light"><tr><th>Mã phiếu</th><th>Shop</th><th>Ngày lập</th><th>Số đơn</th><th class="text-end">Trả shop</th><th>Trạng thái</th></tr></thead>
            <tbody>
            <tr th:each="s : ${settlements}">
                <td><a th:href="@{/admin/settlements/{id}(id=${s.id})}" th:text="${s.code}"></a></td>
                <td th:text="${s.shop.shopName}"></td>
                <td th:text="${@fmt.dateTime(s.createdAt)}"></td>
                <td th:text="${#lists.size(s.orders)}"></td>
                <td class="text-end fw-semibold" th:text="${@fmt.money(s.payoutAmount)}"></td>
                <td><span class="badge" th:classappend="${'text-bg-' + s.statusBadge}" th:text="${s.statusLabel}"></span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(settlements)}"><td colspan="6" class="text-center text-muted py-4">Chưa có phiếu đối soát</td></tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
