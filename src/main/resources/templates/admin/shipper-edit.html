<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sửa shipper')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Sửa shipper <span class="text-muted" th:text="${shipper.username}"></span></h1>
        <a class="btn btn-outline-secondary" th:href="@{/admin/shippers}">← Danh sách</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/admin/shippers/{id}/edit(id=${shipper.id})}" th:object="${form}" method="post" class="row g-3" novalidate>
                <div class="col-md-6">
                    <label class="form-label">Họ tên</label>
                    <input class="form-control" th:field="*{fullName}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Số điện thoại</label>
                    <input class="form-control" th:field="*{phone}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Biển số xe</label>
                    <input class="form-control" th:field="*{vehiclePlate}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{vehiclePlate}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Vùng phụ trách</label>
                    <select class="form-select" th:field="*{zoneId}">
                        <option value="">-- Không cố định --</option>
                        <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}"></option>
                    </select>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary">Lưu thay đổi</button>
                    <a class="btn btn-outline-warning" th:href="@{/admin/users/{id}/password(id=${shipper.id})}">Đặt lại mật khẩu</a>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
