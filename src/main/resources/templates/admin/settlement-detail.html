<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Phiếu đối soát')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Phiếu đối soát <span th:text="${settlement.code}"></span></h1>
        <a class="btn btn-outline-secondary" th:href="@{/admin/settlements}">← Danh sách</a>
    </div>

    <div class="card mb-3 border-primary" th:if="${settlement.status.name() == 'CHO_THANH_TOAN'}">
        <div class="card-body">
            <form class="d-flex gap-2 align-items-end" th:action="@{/admin/settlements/{id}/pay(id=${settlement.id})}" method="post">
                <div>
                    <label class="form-label">Mã giao dịch chuyển khoản</label>
                    <input class="form-control" name="paymentRef" required placeholder="Ví dụ: FT25111812345">
                </div>
                <button class="btn btn-success">Ghi nhận đã thanh toán</button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/settlement :: detail(${settlement}, '/admin/orders')}"></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
