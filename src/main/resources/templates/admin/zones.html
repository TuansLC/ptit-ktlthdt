<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vùng giao hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4 mb-1">Vùng giao hàng</h1>
    <p class="text-muted">
        Phạm vi phục vụ là các phường nội thành Hà Nội theo địa giới hành chính 2 cấp (từ 01/7/2025).
        Phường chưa gán vùng nằm ngoài phạm vi, shop không tạo được đơn lấy hoặc giao tại đó.
    </p>

    <div class="row g-3 mb-4">
        <div class="col-md-4" th:each="z : ${zones}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="fw-semibold"><span class="badge text-bg-primary me-1" th:text="${z.code}"></span><span th:text="${z.name}"></span></div>
                    <div class="small text-muted mt-1" th:text="${z.description}"></div>
                    <div class="small mt-2">Số phường: <strong th:text="${wardCount.get(z.id) ?: 0}"></strong></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <form th:action="@{/admin/zones}" th:object="${zoneForm}" method="post" class="row g-2" novalidate>
                        <div class="col-4">
                            <input class="form-control form-control-sm" th:field="*{code}" placeholder="Mã (V3)" th:errorclass="is-invalid">
                        </div>
                        <div class="col-8">
                            <input class="form-control form-control-sm" th:field="*{name}" placeholder="Tên vùng" th:errorclass="is-invalid">
                        </div>
                        <div class="col-12">
                            <input class="form-control form-control-sm" th:field="*{description}" placeholder="Mô tả">
                        </div>
                        <div class="col-12 small text-danger" th:if="${#fields.hasErrors('*')}">
                            <div th:each="e : ${#fields.errors('*')}" th:text="${e}"></div>
                        </div>
                        <div class="col-12"><button class="btn btn-sm btn-outline-primary">+ Thêm vùng</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <h2 class="h5">Gán phường vào vùng</h2>
    <div class="table-responsive">
        <table class="table table-sm bg-white align-middle">
            <thead class="table-light"><tr><th>Phường</th><th>Vùng hiện tại</th><th style="width: 360px">Đổi vùng</th></tr></thead>
            <tbody>
            <tr th:each="w : ${wards}" th:id="${'ward-' + w.id}">
                <td th:text="${w.name}"></td>
                <td>
                    <span th:if="${w.zone}" class="badge text-bg-primary" th:text="${w.zone.code}"></span>
                    <span th:unless="${w.zone}" class="badge text-bg-secondary">Ngoài phạm vi</span>
                </td>
                <td>
                    <form class="d-flex gap-2" th:action="@{/admin/wards/{id}/zone(id=${w.id})}" method="post">
                        <select class="form-select form-select-sm" name="zoneId">
                            <option value="" th:selected="${w.zone == null}">Ngoài phạm vi</option>
                            <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}"
                                    th:selected="${w.zone != null and w.zone.id == z.id}"></option>
                        </select>
                        <button class="btn btn-sm btn-outline-primary">Lưu</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
