<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Phiếu nộp COD')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Phiếu nộp tiền <span th:text="${remittance.code}"></span></h1>
        <a class="btn btn-outline-secondary" th:href="@{/admin/remittances}">← Danh sách</a>
    </div>

    <div class="card mb-3 border-primary" th:if="${remittance.status.name() == 'CHO_XAC_NHAN'}">
        <div class="card-body d-flex flex-wrap gap-3 align-items-end">
            <form th:action="@{/admin/remittances/{id}/confirm(id=${remittance.id})}" method="post"
                  onsubmit="return confirm('Xác nhận đã nhận đủ tiền?')">
                <button class="btn btn-success">Xác nhận đã nhận đủ tiền</button>
            </form>
            <form class="d-flex gap-2 align-items-end" th:action="@{/admin/remittances/{id}/reject(id=${remittance.id})}" method="post">
                <div>
                    <label class="form-label">Lý do từ chối</label>
                    <input class="form-control" name="reason" required placeholder="Ví dụ: thiếu 50.000 đ">
                </div>
                <button class="btn btn-outline-danger">Từ chối</button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/remittance :: detail(${remittance}, '/admin/orders')}"></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
