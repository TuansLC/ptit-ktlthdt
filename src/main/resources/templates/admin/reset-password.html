<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div class="mx-auto auth-card">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="card">
            <div class="card-header fw-semibold">Đặt lại mật khẩu</div>
            <div class="card-body">
                <p class="mb-3">
                    Tài khoản <strong th:text="${user.username}"></strong>
                    (<span th:text="${user.fullName + ' - ' + user.role.label}"></span>).
                    Sau khi đặt lại, hãy báo mật khẩu mới cho người dùng và nhắc họ đổi lại trong mục <em>Đổi mật khẩu</em>.
                </p>
                <form th:action="@{/admin/users/{id}/password(id=${user.id})}" method="post"
                      onsubmit="return confirm('Đặt lại mật khẩu cho tài khoản này?')">
                    <div class="mb-3">
                        <label class="form-label" for="newPassword">Mật khẩu mới</label>
                        <input class="form-control" id="newPassword" name="newPassword" type="text"
                               minlength="6" maxlength="100" required autocomplete="off">
                        <div class="form-text">Tối thiểu 6 ký tự.</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-warning">Đặt lại mật khẩu</button>
                        <a class="btn btn-outline-secondary"
                           th:href="@{${user.role.name() == 'SHOP' ? '/admin/shops' : '/admin/shippers'}}">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
